<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPA Load Board - Training Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .equipment-DV { background-color: #f3f4f6; color: #1f2937; }
    .equipment-RF { background-color: #dbeafe; color: #1e40af; }
    .equipment-FB { background-color: #ffedd5; color: #c2410c; }
    .equipment-SD { background-color: #fef3c7; color: #a16207; }
    .load-row { cursor: pointer; transition: background-color 0.15s; }
    .load-row:hover { background-color: #eff6ff; }
    .load-row.selected { background-color: #dbeafe; border-left: 4px solid #2563eb; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <!-- Header -->
  <header class="bg-[#003366] text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <div class="flex items-center space-x-4">
          <h1 class="text-xl md:text-2xl font-bold">FPA Load Board</h1>
          <span class="bg-yellow-500 text-black px-2 py-1 rounded text-xs font-bold">TRAINING</span>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="openModal('truckModal')" class="bg-white/10 hover:bg-white/20 px-3 py-2 rounded text-sm">🚚 Truck</button>
          <button onclick="openModal('bookingsModal')" class="bg-white/10 hover:bg-white/20 px-3 py-2 rounded text-sm">📋 <span id="bookingCount">0</span></button>
          <button onclick="openModal('statsModal')" class="bg-white/10 hover:bg-white/20 px-3 py-2 rounded text-sm">📊</button>
        </div>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 py-4">
    <!-- Filters (collapsible on mobile) -->
    <div class="bg-white rounded-lg shadow p-4 mb-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold">Filters</h2>
        <button onclick="toggleFilters()" class="md:hidden text-blue-600 text-sm">Toggle</button>
      </div>
      <div id="filtersContent" class="grid grid-cols-2 md:grid-cols-6 gap-3">
        <div>
          <label class="block text-xs text-gray-600 mb-1">Origin</label>
          <input type="text" id="originFilter" placeholder="City, ST" class="w-full border rounded px-2 py-1 text-sm" onkeyup="filterLoads()">
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">Destination</label>
          <input type="text" id="destFilter" placeholder="City, ST" class="w-full border rounded px-2 py-1 text-sm" onkeyup="filterLoads()">
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">Equipment</label>
          <select id="equipFilter" class="w-full border rounded px-2 py-1 text-sm" onchange="filterLoads()">
            <option value="">All</option>
            <option value="DV">Dry Van</option>
            <option value="RF">Reefer</option>
            <option value="FB">Flatbed</option>
            <option value="SD">Step Deck</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">Min $/mi</label>
          <input type="number" id="minRPM" step="0.1" placeholder="2.50" class="w-full border rounded px-2 py-1 text-sm" onkeyup="filterLoads()">
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">Max DH</label>
          <input type="number" id="maxDH" placeholder="150" class="w-full border rounded px-2 py-1 text-sm" onkeyup="filterLoads()">
        </div>
        <div class="flex items-end">
          <button onclick="clearFilters()" class="w-full bg-gray-200 hover:bg-gray-300 py-1 rounded text-sm">Clear</button>
        </div>
      </div>
    </div>

    <!-- Results -->
    <div class="bg-white rounded-lg shadow p-3 mb-2">
      <span class="text-gray-600"><strong id="loadCount">0</strong> loads found</span>
      <span class="text-sm text-gray-400 ml-2">📍 From: <span id="currentLocation">Chicago, IL</span></span>
    </div>

    <!-- Load Table -->
    <div class="bg-white rounded-lg shadow overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b">
          <tr>
            <th class="text-left px-3 py-2 font-medium text-gray-600">Origin</th>
            <th class="text-left px-3 py-2 font-medium text-gray-600">Destination</th>
            <th class="text-center px-2 py-2 font-medium text-gray-600">Eq</th>
            <th class="text-right px-2 py-2 font-medium text-gray-600">Mi</th>
            <th class="text-right px-2 py-2 font-medium text-gray-600">DH</th>
            <th class="text-right px-3 py-2 font-medium text-gray-600">Rate</th>
            <th class="text-right px-2 py-2 font-medium text-gray-600">$/mi</th>
            <th class="text-center px-2 py-2 font-medium text-gray-600">Credit</th>
          </tr>
        </thead>
        <tbody id="loadsTable"></tbody>
      </table>
      <div id="noLoads" class="p-8 text-center text-gray-500 hidden">No loads match your filters.</div>
    </div>
  </div>

  <!-- Load Details Modal -->
  <div id="loadModal" class="modal">
    <div class="bg-white rounded-lg shadow-xl max-w-lg w-full mx-4 max-h-[90vh] overflow-y-auto">
      <div class="bg-[#003366] text-white p-4 flex justify-between items-center">
        <h2 class="font-bold">Load Details</h2>
        <button onclick="closeModal('loadModal')" class="text-2xl">&times;</button>
      </div>
      <div id="loadDetails" class="p-4"></div>
    </div>
  </div>

  <!-- Truck Profile Modal -->
  <div id="truckModal" class="modal">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
      <div class="bg-[#003366] text-white p-4 flex justify-between items-center">
        <h2 class="font-bold">🚚 Truck Profile</h2>
        <button onclick="closeModal('truckModal')" class="text-2xl">&times;</button>
      </div>
      <div class="p-4">
        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-medium mb-1">Truck Name</label>
            <input type="text" id="truckName" value="My Truck" class="w-full border rounded px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">MC Number</label>
            <input type="text" id="truckMC" value="MC-123456" class="w-full border rounded px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Equipment</label>
            <select id="truckEquip" class="w-full border rounded px-3 py-2">
              <option value="DV">Dry Van</option>
              <option value="RF">Reefer</option>
              <option value="FB">Flatbed</option>
              <option value="SD">Step Deck</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Location</label>
            <select id="truckLocation" class="w-full border rounded px-3 py-2">
              <option value="Chicago, IL">Chicago, IL</option>
              <option value="Dallas, TX">Dallas, TX</option>
              <option value="Atlanta, GA">Atlanta, GA</option>
              <option value="Los Angeles, CA">Los Angeles, CA</option>
              <option value="Denver, CO">Denver, CO</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Min $/mile</label>
            <input type="number" id="truckMinRPM" value="2.50" step="0.1" class="w-full border rounded px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Max Deadhead</label>
            <input type="number" id="truckMaxDH" value="150" class="w-full border rounded px-3 py-2">
          </div>
        </div>
        <button onclick="saveTruckProfile()" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded font-bold">Save Profile</button>
      </div>
    </div>
  </div>

  <!-- Bookings Modal -->
  <div id="bookingsModal" class="modal">
    <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
      <div class="bg-[#003366] text-white p-4 flex justify-between items-center">
        <h2 class="font-bold">📋 My Bookings</h2>
        <button onclick="closeModal('bookingsModal')" class="text-2xl">&times;</button>
      </div>
      <div class="p-4">
        <div id="bookingsSummary" class="grid grid-cols-3 gap-4 mb-4"></div>
        <div id="bookingsList"></div>
      </div>
    </div>
  </div>

  <!-- Stats Modal -->
  <div id="statsModal" class="modal">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
      <div class="bg-[#003366] text-white p-4 flex justify-between items-center">
        <h2 class="font-bold">📊 Statistics</h2>
        <button onclick="closeModal('statsModal')" class="text-2xl">&times;</button>
      </div>
      <div id="statsContent" class="p-4"></div>
    </div>
  </div>

  <!-- Booking Flow Modal -->
  <div id="bookingFlowModal" class="modal">
    <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
      <div class="bg-[#003366] text-white p-4 flex justify-between items-center">
        <h2 class="font-bold">📞 Book Load</h2>
        <button onclick="closeModal('bookingFlowModal')" class="text-2xl">&times;</button>
      </div>
      <div id="bookingFlowContent" class="p-4"></div>
    </div>
  </div>

<script>
// Data
const cities = [
  {name: 'Chicago', state: 'IL', lat: 41.8781, lng: -87.6298},
  {name: 'Dallas', state: 'TX', lat: 32.7767, lng: -96.7970},
  {name: 'Atlanta', state: 'GA', lat: 33.7490, lng: -84.3880},
  {name: 'Los Angeles', state: 'CA', lat: 34.0522, lng: -118.2437},
  {name: 'Denver', state: 'CO', lat: 39.7392, lng: -104.9903},
  {name: 'Houston', state: 'TX', lat: 29.7604, lng: -95.3698},
  {name: 'Phoenix', state: 'AZ', lat: 33.4484, lng: -112.0740},
  {name: 'Miami', state: 'FL', lat: 25.7617, lng: -80.1918},
  {name: 'Seattle', state: 'WA', lat: 47.6062, lng: -122.3321},
  {name: 'Detroit', state: 'MI', lat: 42.3314, lng: -83.0458},
  {name: 'Philadelphia', state: 'PA', lat: 39.9526, lng: -75.1652},
  {name: 'Nashville', state: 'TN', lat: 36.1627, lng: -86.7816},
  {name: 'Charlotte', state: 'NC', lat: 35.2271, lng: -80.8431},
  {name: 'Indianapolis', state: 'IN', lat: 39.7684, lng: -86.1581},
  {name: 'Columbus', state: 'OH', lat: 39.9612, lng: -82.9988},
  {name: 'Memphis', state: 'TN', lat: 35.1495, lng: -90.0490},
  {name: 'Kansas City', state: 'MO', lat: 39.0997, lng: -94.5786},
  {name: 'Jacksonville', state: 'FL', lat: 30.3322, lng: -81.6557},
  {name: 'San Antonio', state: 'TX', lat: 29.4241, lng: -98.4936},
  {name: 'Portland', state: 'OR', lat: 45.5152, lng: -122.6784},
];

const brokers = [
  {id: 'b1', name: 'CH Robinson', mc: 'MC-128732', credit: 98, days: 30, phone: '(800) 323-7587'},
  {id: 'b2', name: 'TQL', mc: 'MC-354840', credit: 95, days: 28, phone: '(800) 580-3101'},
  {id: 'b3', name: 'Coyote Logistics', mc: 'MC-551052', credit: 96, days: 21, phone: '(877) 626-9683'},
  {id: 'b4', name: 'Landstar', mc: 'MC-143034', credit: 99, days: 14, phone: '(877) 696-4507'},
  {id: 'b5', name: 'Echo Global', mc: 'MC-537809', credit: 92, days: 35, phone: '(800) 354-7993'},
  {id: 'b6', name: 'Midwest Freight', mc: 'MC-892341', credit: 78, days: 45, phone: '(312) 555-0187'},
  {id: 'b7', name: 'Quick Load', mc: 'MC-987234', credit: 55, days: 60, phone: '(214) 555-0789'},
];

const commodities = ['General Freight', 'Palletized Goods', 'Electronics', 'Beverages', 'Auto Parts', 'Building Materials', 'Fresh Produce', 'Frozen Food'];
const equipTypes = ['DV', 'RF', 'FB', 'SD'];

let loads = [];
let bookings = [];
let selectedLoad = null;
let truckProfile = {
  name: 'My Truck',
  mc: 'MC-123456',
  equipment: 'DV',
  location: 'Chicago, IL',
  minRPM: 2.50,
  maxDH: 150
};

// Distance calculation
function calcDistance(c1, c2) {
  const R = 3959;
  const dLat = (c2.lat - c1.lat) * Math.PI / 180;
  const dLon = (c2.lng - c1.lng) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(c1.lat*Math.PI/180) * Math.cos(c2.lat*Math.PI/180) * Math.sin(dLon/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)) * 1.15);
}

function getCurrentCity() {
  const loc = truckProfile.location;
  return cities.find(c => `${c.name}, ${c.state}` === loc) || cities[0];
}

// Generate loads
function generateLoads() {
  loads = [];
  const today = new Date();
  
  for (let i = 0; i < 100; i++) {
    const origin = cities[Math.floor(Math.random() * cities.length)];
    let dest = cities[Math.floor(Math.random() * cities.length)];
    while (dest === origin) dest = cities[Math.floor(Math.random() * cities.length)];
    
    const miles = calcDistance(origin, dest);
    if (miles < 150 || miles > 2000) continue;
    
    const broker = brokers[Math.floor(Math.random() * Math.random() * brokers.length)];
    const equip = equipTypes[Math.floor(Math.random() * equipTypes.length)];
    
    let baseRPM = 2.2 + Math.random() * 0.8;
    if (equip === 'RF') baseRPM += 0.3;
    if (equip === 'FB') baseRPM += 0.25;
    if (dest.state === 'FL') baseRPM *= 0.85;
    
    const rate = Math.round(miles * baseRPM);
    const rpm = Math.round(baseRPM * 100) / 100;
    
    const pickupDays = Math.floor(Math.random() * 3);
    const pickupDate = new Date(today);
    pickupDate.setDate(today.getDate() + pickupDays);
    
    loads.push({
      id: `L${1000 + i}`,
      ref: `REF-${broker.mc.split('-')[1]}-${1000 + i}`,
      origin: `${origin.name}, ${origin.state}`,
      originCity: origin,
      dest: `${dest.name}, ${dest.state}`,
      destCity: dest,
      equipment: equip,
      miles,
      rate,
      rpm,
      broker,
      commodity: commodities[Math.floor(Math.random() * commodities.length)],
      weight: Math.round((20000 + Math.random() * 25000) / 1000) * 1000,
      pallets: Math.floor(Math.random() * 24) + 2,
      pickupDate: pickupDate.toISOString().split('T')[0],
      pickupTime: `${6 + Math.floor(Math.random() * 10)}:00`,
      pickupType: Math.random() > 0.4 ? 'Appointment' : 'FCFS',
      deliveryType: Math.random() > 0.7 ? 'Drop & Hook' : 'Live Unload',
      lumper: Math.random() > 0.6,
      detention: Math.random() > 0.3 ? 50 + Math.floor(Math.random() * 3) * 25 : 0
    });
  }
  
  loads.sort((a, b) => b.rpm - a.rpm);
}

function getDeadhead(load) {
  return calcDistance(getCurrentCity(), load.originCity);
}

function getEffectiveRPM(load) {
  const dh = getDeadhead(load);
  return Math.round((load.rate / (load.miles + dh)) * 100) / 100;
}

function getCreditClass(credit) {
  if (credit >= 85) return 'bg-green-500';
  if (credit >= 65) return 'bg-yellow-500';
  return 'bg-red-500';
}

// Render loads
function renderLoads() {
  const tbody = document.getElementById('loadsTable');
  const noLoads = document.getElementById('noLoads');
  
  const filtered = getFilteredLoads();
  document.getElementById('loadCount').textContent = filtered.length;
  
  if (filtered.length === 0) {
    tbody.innerHTML = '';
    noLoads.classList.remove('hidden');
    return;
  }
  
  noLoads.classList.add('hidden');
  tbody.innerHTML = filtered.slice(0, 50).map(load => {
    const dh = getDeadhead(load);
    const effRPM = getEffectiveRPM(load);
    const isBooked = bookings.some(b => b.id === load.id);
    
    return `
      <tr class="load-row border-b ${isBooked ? 'opacity-50' : ''}" onclick="showLoadDetails('${load.id}')">
        <td class="px-3 py-2"><div class="font-medium">${load.origin.split(',')[0]}</div><div class="text-xs text-gray-500">${load.origin.split(',')[1]}</div></td>
        <td class="px-3 py-2"><div class="font-medium">${load.dest.split(',')[0]}</div><div class="text-xs text-gray-500">${load.dest.split(',')[1]}</div></td>
        <td class="px-2 py-2 text-center"><span class="px-2 py-0.5 rounded text-xs font-medium equipment-${load.equipment}">${load.equipment}</span></td>
        <td class="px-2 py-2 text-right font-mono">${load.miles}</td>
        <td class="px-2 py-2 text-right font-mono text-gray-500">${dh}</td>
        <td class="px-3 py-2 text-right font-mono font-bold text-green-600">$${load.rate.toLocaleString()}</td>
        <td class="px-2 py-2 text-right"><div class="font-mono font-bold">$${load.rpm}</div><div class="text-xs text-gray-400">$${effRPM}</div></td>
        <td class="px-2 py-2 text-center"><div class="w-3 h-3 rounded-full ${getCreditClass(load.broker.credit)} mx-auto" title="${load.broker.credit}"></div></td>
      </tr>
    `;
  }).join('');
}

function getFilteredLoads() {
  const origin = document.getElementById('originFilter').value.toLowerCase();
  const dest = document.getElementById('destFilter').value.toLowerCase();
  const equip = document.getElementById('equipFilter').value;
  const minRPM = parseFloat(document.getElementById('minRPM').value) || 0;
  const maxDH = parseInt(document.getElementById('maxDH').value) || 9999;
  
  return loads.filter(load => {
    if (bookings.some(b => b.id === load.id)) return false;
    if (origin && !load.origin.toLowerCase().includes(origin)) return false;
    if (dest && !load.dest.toLowerCase().includes(dest)) return false;
    if (equip && load.equipment !== equip) return false;
    if (load.rpm < minRPM) return false;
    if (getDeadhead(load) > maxDH) return false;
    return true;
  });
}

function filterLoads() {
  renderLoads();
}

function clearFilters() {
  document.getElementById('originFilter').value = '';
  document.getElementById('destFilter').value = '';
  document.getElementById('equipFilter').value = '';
  document.getElementById('minRPM').value = '';
  document.getElementById('maxDH').value = '';
  renderLoads();
}

function toggleFilters() {
  document.getElementById('filtersContent').classList.toggle('hidden');
}

// Load details
function showLoadDetails(id) {
  const load = loads.find(l => l.id === id);
  if (!load) return;
  
  selectedLoad = load;
  const dh = getDeadhead(load);
  const effRPM = getEffectiveRPM(load);
  const isBooked = bookings.some(b => b.id === load.id);
  const creditClass = load.broker.credit >= 85 ? 'text-green-600' : load.broker.credit >= 65 ? 'text-yellow-600' : 'text-red-600';
  
  let warnings = [];
  if (effRPM < truckProfile.minRPM) warnings.push(`⚠️ Effective RPM ($${effRPM}) below your min ($${truckProfile.minRPM})`);
  if (dh > truckProfile.maxDH) warnings.push(`⚠️ Deadhead (${dh} mi) exceeds your max (${truckProfile.maxDH} mi)`);
  if (load.broker.credit < 65) warnings.push('⚠️ Broker has poor credit rating');
  
  document.getElementById('loadDetails').innerHTML = `
    <div class="text-xs text-gray-500 mb-2">Ref: ${load.ref}</div>
    
    <div class="flex items-center justify-between border-b pb-4 mb-4">
      <div>
        <div class="text-xs text-gray-500">PICKUP</div>
        <div class="font-bold text-lg">${load.origin}</div>
        <div class="text-sm text-gray-600">${load.pickupDate} @ ${load.pickupTime}</div>
        <div class="text-xs text-gray-500">${load.pickupType}</div>
      </div>
      <div class="text-2xl text-gray-400">→</div>
      <div class="text-right">
        <div class="text-xs text-gray-500">DELIVERY</div>
        <div class="font-bold text-lg">${load.dest}</div>
        <div class="text-sm text-gray-600">${load.deliveryType}</div>
      </div>
    </div>
    
    <div class="grid grid-cols-3 gap-4 mb-4 text-center">
      <div class="bg-gray-50 p-3 rounded">
        <div class="text-xs text-gray-500">Loaded Miles</div>
        <div class="font-bold text-xl">${load.miles}</div>
      </div>
      <div class="bg-gray-50 p-3 rounded">
        <div class="text-xs text-gray-500">Deadhead</div>
        <div class="font-bold text-xl text-gray-500">${dh}</div>
      </div>
      <div class="bg-green-50 p-3 rounded">
        <div class="text-xs text-gray-500">Rate</div>
        <div class="font-bold text-xl text-green-600">$${load.rate.toLocaleString()}</div>
      </div>
    </div>
    
    <div class="grid grid-cols-2 gap-4 mb-4 text-center">
      <div class="bg-gray-50 p-2 rounded">
        <div class="text-xs text-gray-500">Rate/Mile</div>
        <div class="font-bold">$${load.rpm}/mi</div>
      </div>
      <div class="bg-gray-50 p-2 rounded">
        <div class="text-xs text-gray-500">Effective RPM</div>
        <div class="font-bold ${effRPM >= truckProfile.minRPM ? 'text-green-600' : 'text-red-600'}">$${effRPM}/mi</div>
      </div>
    </div>
    
    <div class="border-b pb-4 mb-4">
      <div class="text-xs text-gray-500 mb-2">LOAD INFO</div>
      <div class="grid grid-cols-2 gap-2 text-sm">
        <div><span class="text-gray-500">Equipment:</span> <span class="px-2 py-0.5 rounded text-xs font-medium equipment-${load.equipment}">${load.equipment}</span></div>
        <div><span class="text-gray-500">Weight:</span> ${load.weight.toLocaleString()} lbs</div>
        <div><span class="text-gray-500">Pallets:</span> ${load.pallets}</div>
        <div><span class="text-gray-500">Commodity:</span> ${load.commodity}</div>
      </div>
      <div class="flex flex-wrap gap-2 mt-3">
        ${load.lumper ? '<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs">✓ Lumper Included</span>' : ''}
        ${load.detention ? `<span class="bg-gray-100 text-gray-800 px-2 py-1 rounded text-xs">⏱️ Detention $${load.detention}/hr</span>` : ''}
      </div>
    </div>
    
    <div class="border-b pb-4 mb-4">
      <div class="text-xs text-gray-500 mb-2">BROKER</div>
      <div class="flex justify-between items-center">
        <div>
          <div class="font-bold">${load.broker.name}</div>
          <div class="text-sm text-gray-600">${load.broker.mc}</div>
          <div class="text-sm text-gray-500">${load.broker.phone}</div>
        </div>
        <div class="text-right">
          <div class="font-bold ${creditClass}">Credit: ${load.broker.credit}</div>
          <div class="text-sm text-gray-500">Pays in ${load.broker.days} days</div>
        </div>
      </div>
    </div>
    
    ${warnings.length > 0 ? `<div class="bg-yellow-50 border border-yellow-200 rounded p-3 mb-4">${warnings.map(w => `<div class="text-sm text-yellow-800">${w}</div>`).join('')}</div>` : ''}
    
    ${isBooked ? 
      '<div class="bg-green-100 text-green-800 py-3 rounded text-center font-bold">✓ Already Booked</div>' :
      `<button onclick="startBooking('${load.id}')" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded font-bold text-lg">📞 Book This Load</button>`
    }
  `;
  
  openModal('loadModal');
}

// Booking flow
function startBooking(id) {
  const load = loads.find(l => l.id === id);
  if (!load) return;
  
  closeModal('loadModal');
  
  document.getElementById('bookingFlowContent').innerHTML = `
    <div class="bg-gray-50 p-4 rounded mb-4">
      <div class="font-bold text-lg">${load.broker.name}</div>
      <div class="text-gray-600">${load.broker.phone}</div>
      <div class="text-sm text-gray-500 mt-2">${load.origin} → ${load.dest}</div>
    </div>
    
    <div class="mb-6">
      <h3 class="font-bold mb-3">📋 Call Checklist</h3>
      <div class="space-y-2">
        <label class="flex items-center space-x-3 p-2 hover:bg-gray-50 rounded cursor-pointer">
          <input type="checkbox" class="w-5 h-5 rounded">
          <span>Is this load still available?</span>
        </label>
        <label class="flex items-center space-x-3 p-2 hover:bg-gray-50 rounded cursor-pointer">
          <input type="checkbox" class="w-5 h-5 rounded">
          <span>What is the commodity?</span>
        </label>
        <label class="flex items-center space-x-3 p-2 hover:bg-gray-50 rounded cursor-pointer">
          <input type="checkbox" class="w-5 h-5 rounded">
          <span>How many pallets/pieces?</span>
        </label>
        <label class="flex items-center space-x-3 p-2 hover:bg-gray-50 rounded cursor-pointer">
          <input type="checkbox" class="w-5 h-5 rounded">
          <span>What's the pickup window?</span>
        </label>
        <label class="flex items-center space-x-3 p-2 hover:bg-gray-50 rounded cursor-pointer">
          <input type="checkbox" class="w-5 h-5 rounded">
          <span>Live load or preloaded?</span>
        </label>
        <label class="flex items-center space-x-3 p-2 hover:bg-gray-50 rounded cursor-pointer">
          <input type="checkbox" class="w-5 h-5 rounded">
          <span>Who pays for lumper?</span>
        </label>
        <label class="flex items-center space-x-3 p-2 hover:bg-gray-50 rounded cursor-pointer">
          <input type="checkbox" class="w-5 h-5 rounded">
          <span>What is the rate?</span>
        </label>
      </div>
    </div>
    
    <div class="bg-yellow-50 border border-yellow-200 p-4 rounded mb-6">
      <h4 class="font-bold text-yellow-800 mb-2">Opening Script:</h4>
      <p class="text-sm italic">"Hi, this is calling from ${truckProfile.name}. I'm calling about load number ${load.ref} from ${load.origin.split(',')[0]} to ${load.dest.split(',')[0]}. Is this load still available?"</p>
    </div>
    
    <div class="bg-green-50 border border-green-200 p-4 rounded mb-6">
      <h4 class="font-bold text-green-800 mb-2">Negotiated Rate</h4>
      <div class="flex items-center space-x-4">
        <span class="text-gray-600">Posted: $${load.rate.toLocaleString()}</span>
        <input type="number" id="negotiatedRate" value="${load.rate}" class="border rounded px-3 py-2 w-32 font-bold text-lg">
      </div>
    </div>
    
    <button onclick="confirmBooking('${load.id}')" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded font-bold">Broker Confirmed → Book Load</button>
  `;
  
  openModal('bookingFlowModal');
}

function confirmBooking(id) {
  const load = loads.find(l => l.id === id);
  if (!load) return;
  
  const negotiatedRate = parseInt(document.getElementById('negotiatedRate').value) || load.rate;
  
  bookings.push({
    ...load,
    negotiatedRate,
    bookedAt: new Date().toISOString()
  });
  
  closeModal('bookingFlowModal');
  updateBookingCount();
  renderLoads();
  
  alert('✓ Load booked successfully!');
}

function updateBookingCount() {
  document.getElementById('bookingCount').textContent = bookings.length;
}

// Truck profile
function saveTruckProfile() {
  truckProfile = {
    name: document.getElementById('truckName').value,
    mc: document.getElementById('truckMC').value,
    equipment: document.getElementById('truckEquip').value,
    location: document.getElementById('truckLocation').value,
    minRPM: parseFloat(document.getElementById('truckMinRPM').value) || 2.50,
    maxDH: parseInt(document.getElementById('truckMaxDH').value) || 150
  };
  
  document.getElementById('currentLocation').textContent = truckProfile.location;
  closeModal('truckModal');
  renderLoads();
}

// Modals
function openModal(id) {
  document.getElementById(id).classList.add('active');
  
  if (id === 'bookingsModal') renderBookings();
  if (id === 'statsModal') renderStats();
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function renderBookings() {
  const totalRevenue = bookings.reduce((s, b) => s + (b.negotiatedRate || b.rate), 0);
  const totalMiles = bookings.reduce((s, b) => s + b.miles, 0);
  const avgRPM = totalMiles > 0 ? (totalRevenue / totalMiles).toFixed(2) : '0.00';
  
  document.getElementById('bookingsSummary').innerHTML = `
    <div class="bg-blue-50 p-3 rounded text-center">
      <div class="text-2xl font-bold text-blue-600">${bookings.length}</div>
      <div class="text-xs text-gray-600">Loads</div>
    </div>
    <div class="bg-green-50 p-3 rounded text-center">
      <div class="text-2xl font-bold text-green-600">$${totalRevenue.toLocaleString()}</div>
      <div class="text-xs text-gray-600">Revenue</div>
    </div>
    <div class="bg-purple-50 p-3 rounded text-center">
      <div class="text-2xl font-bold text-purple-600">$${avgRPM}</div>
      <div class="text-xs text-gray-600">Avg $/mi</div>
    </div>
  `;
  
  if (bookings.length === 0) {
    document.getElementById('bookingsList').innerHTML = '<div class="text-center text-gray-500 py-8">No bookings yet</div>';
    return;
  }
  
  document.getElementById('bookingsList').innerHTML = bookings.map(b => `
    <div class="border-b py-3">
      <div class="flex justify-between items-start">
        <div>
          <div class="font-medium">${b.origin} → ${b.dest}</div>
          <div class="text-sm text-gray-500">${b.broker.name} • ${b.miles} mi</div>
        </div>
        <div class="text-right">
          <div class="font-bold text-green-600">$${(b.negotiatedRate || b.rate).toLocaleString()}</div>
          <div class="text-xs text-gray-500">${b.equipment}</div>
        </div>
      </div>
    </div>
  `).join('');
}

function renderStats() {
  const totalLoads = bookings.length;
  const totalRevenue = bookings.reduce((s, b) => s + (b.negotiatedRate || b.rate), 0);
  const totalMiles = bookings.reduce((s, b) => s + b.miles, 0);
  const avgRPM = totalMiles > 0 ? totalRevenue / totalMiles : 0;
  
  let score = 0;
  if (totalLoads >= 5) score += 25;
  else if (totalLoads >= 3) score += 15;
  if (avgRPM >= 2.75) score += 35;
  else if (avgRPM >= 2.50) score += 25;
  if (totalMiles >= 2500) score += 25;
  else if (totalMiles >= 1500) score += 15;
  
  const badBrokers = bookings.filter(b => b.broker.credit < 65).length;
  if (badBrokers === 0) score += 15;
  
  let grade = 'F', color = 'text-red-600';
  if (score >= 80) { grade = 'A'; color = 'text-green-600'; }
  else if (score >= 60) { grade = 'B'; color = 'text-blue-600'; }
  else if (score >= 40) { grade = 'C'; color = 'text-yellow-600'; }
  
  document.getElementById('statsContent').innerHTML = `
    <div class="text-center mb-6">
      <div class="text-5xl font-bold ${color}">${grade}</div>
      <div class="text-gray-600">Score: ${score}/100</div>
    </div>
    
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div class="bg-blue-50 p-3 rounded text-center">
        <div class="text-2xl font-bold">${totalLoads}</div>
        <div class="text-xs text-gray-600">Loads</div>
      </div>
      <div class="bg-green-50 p-3 rounded text-center">
        <div class="text-2xl font-bold">$${totalRevenue.toLocaleString()}</div>
        <div class="text-xs text-gray-600">Revenue</div>
      </div>
      <div class="bg-purple-50 p-3 rounded text-center">
        <div class="text-2xl font-bold">${totalMiles.toLocaleString()}</div>
        <div class="text-xs text-gray-600">Miles</div>
      </div>
      <div class="bg-orange-50 p-3 rounded text-center">
        <div class="text-2xl font-bold">$${avgRPM.toFixed(2)}</div>
        <div class="text-xs text-gray-600">Avg $/mi</div>
      </div>
    </div>
    
    ${badBrokers > 0 ? `<div class="bg-red-50 border border-red-200 p-3 rounded text-sm text-red-700">⚠️ You booked ${badBrokers} load(s) with poor-credit brokers</div>` : ''}
  `;
}

// Init
generateLoads();
renderLoads();
</script>
</body>
</html>
